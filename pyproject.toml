[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "karhutla-sentiment"
version = "0.1.0"
description = "Beginner-friendly Indonesian news and YouTube sentiment analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.27,<1",
  "requests>=2.32,<3",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.49,<2",
  "transformers>=4.48,<5",
  "torch>=2.6,<3",
  "trafilatura>=2.0,<3",
  "youtube-transcript-api>=1.2,<2",
  "pandas>=2.2,<3",
  "wordcloud>=1.9,<2",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["karhutla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
